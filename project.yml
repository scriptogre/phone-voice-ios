name: PhoneVoice
options:
  bundleIdPrefix: com.christiantanul
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 94F2Q36UHT
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PhoneVoice:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christiantanul.phonevoice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Jev Remote Control
        CFBundleShortVersionString: '0.1'
        CFBundleVersion: '3'
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Stream your voice to the phone controller.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
